<style>

:root{--acc:#2f5f5a;--tint:#f4f4f2;--line:#dcdcd8;--line2:#ececea;--ink:#222;--gray:#707070}

a{color:inherit;text-decoration:none}
b,strong{font-weight:600}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;height:58px}
.logo{font-weight:700;font-size:16px;letter-spacing:-.4px;white-space:nowrap}
nav{display:flex;gap:4px;height:100%}
nav a{display:flex;align-items:center;padding:0 12px;color:var(--gray);border-bottom:2px solid transparent;height:100%;font-size:14.5px;white-space:nowrap}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{display:inline-block;border:1px solid var(--ink);padding:8px 14px;font-size:13.5px;background:#fff;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff}
.btn:hover{background:#000;color:#fff}

.chips a:hover{border-color:var(--ink)}

.tbl td{border-bottom:1px solid var(--line2);padding:9px 8px;vertical-align:top;line-height:1.55}

details.more{border-top:1px solid var(--line);margin-top:30px}
details.more summary{cursor:pointer;padding:14px 2px;font-size:15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'+';display:inline-flex;width:18px;justify-content:center;color:var(--gray)}
details.more[open] summary::before{content:'−'}
details.more summary span{font-size:12.5px;font-weight:400;color:var(--gray)}
details.more>div{padding:0 0 16px}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:40px;padding-top:16px}

@media(max-width:900px){.hm-results,.rc{grid-template-columns:1fr}}
</style></head><body>
