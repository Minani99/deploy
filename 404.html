<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>이동 중</title>
<script>/* 직접 접속·새로고침 주소를 각 앱 첫 화면으로 넘김(앱 index.html 이 되살림) */
(function(){var l=location,p=l.pathname,a=/^\/(portal|pbofc)\//.exec(p);if(a){l.replace('/'+a[1]+'/?p='+encodeURIComponent(p+l.search)+l.hash)}else{l.replace('/')}})();</script>
</head><body>화면으로 이동하는 중입니다.</body></html>
