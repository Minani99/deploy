			});

		// DOM이 모두 로드된 후 실행되도록 이벤트 리스너를 추가합니다.
		document.addEventListener("DOMContentLoaded", function() {
		    
		    // 마이크 버튼과 음성 창 요소를 가져옵니다.
		    const micBtn = document.getElementById("micBtn");
		    const voiceContainer = document.getElementById("voice");
		
		    // 마이크 버튼에 클릭 이벤트를 추가합니다.
		    micBtn.addEventListener("click", function() {
		        // 1. 버튼에 'on' 클래스를 토글합니다. (있으면 제거, 없으면 추가)
		        this.classList.toggle("on");
		
		        // 2. 음성 창의 display 상태를 확인하여 토글합니다.
		        if (voiceContainer.style.display === "none" || voiceContainer.style.display === "") {
		            voiceContainer.style.display = "block"; // 보이게 설정
		        } else {
		            voiceContainer.style.display = "none";  // 안 보이게 설정
		        }
		    });
		    
		});
	</script>
