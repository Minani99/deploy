<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기후위기 정보 서비스 화면 갤러리</title>
<style>
@font-face{font-family:"NotoKR";src:url("fonts/NotoSansKR-VF.ttf") format("truetype");font-weight:100 900}
:root{--acc:#2f5f5a;--acc2:#e9efed;--tint:#f4f4f2;--line:#dcdcd8;--line2:#ececea;--ink:#222;--gray:#707070}
*{box-sizing:border-box}
body{margin:0;font-family:"NotoKR","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:var(--ink);background:#fff;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
b,strong{font-weight:600}
button{font:inherit;cursor:pointer}
/* 상단 */
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:28px;height:58px}
.logo{font-weight:700;font-size:16px;letter-spacing:-.4px;white-space:nowrap}
nav{display:flex;gap:4px;height:100%}
.home-final{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}.home-final a{display:flex;gap:14px;align-items:center;border:1px solid var(--line);padding:12px 14px;background:#fff}.home-final a:hover{border-color:var(--ink)}.home-final a.nx{border-color:#00407D}.home-final img{width:150px;border:1px solid var(--line);flex:none}.home-final b{display:block;font-size:16px;margin:3px 0}.home-final b i{font-style:normal;font-size:11px;color:#fff;background:#00407D;border-radius:3px;padding:1px 6px;margin-left:4px;vertical-align:2px}.home-final p{margin:0;font-size:13px;color:var(--gray)}.hf-tag{font-size:12px;color:var(--gray)}@media(max-width:900px){.home-final{grid-template-columns:1fr}}
nav a{display:flex;align-items:center;padding:0 12px;color:var(--gray);border-bottom:2px solid transparent;height:100%;font-size:14.5px}
nav a:hover{color:var(--ink)}nav a.nav-next i{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:#00407D;border-radius:3px;padding:1px 5px;margin-left:5px}nav a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--acc)}
.sch{display:flex;align-items:center;border:1px solid var(--line);height:34px;width:250px}
.sch input{border:0;outline:0;font:inherit;font-size:13px;padding:0 10px;flex:1;min-width:0;background:none}
.sch button{border:0;background:none;padding:0 10px;color:var(--gray);height:100%}
main{max-width:1280px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:26px;margin:0 0 8px;letter-spacing:-.6px}
h2{font-size:20px;margin:0 0 6px;letter-spacing:-.4px}
h3{font-size:16px;margin:0 0 10px}
.lead{color:var(--gray);font-size:15px;margin:0 0 26px;line-height:1.6}
.crumb{color:var(--gray);font-size:13px;margin-bottom:16px}.crumb a{color:var(--gray)}.crumb a:hover{color:var(--ink);text-decoration:underline}.crumb span{color:var(--ink)}
.muted{color:var(--gray)}.sm{font-size:12.5px}
/* 홈 */
.entry{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:40px}
.ent{border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;background:#fff}
.ent:hover{border-color:#8a8a86}
.ent .pics{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line2)}
.ent .pics img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block}
.ent .tx{padding:16px 18px 18px}
.ent .q{font-size:17px;font-weight:700;line-height:1.4;margin-bottom:6px;letter-spacing:-.4px}
.ent .d{font-size:13px;color:var(--gray);line-height:1.55}
.ent .go{margin-top:12px;font-size:13px;color:var(--acc);font-weight:600}
.nums{display:flex;gap:36px;border-top:1px solid var(--ink);padding-top:14px;margin-bottom:36px}
.nums div{font-size:13px;color:var(--gray)}.nums b{display:block;font-size:24px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.sect-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sect-h h3{margin:0;font-size:17px}.sect-h .q{color:var(--gray);font-size:13.5px}
.sect-h a{margin-left:auto;font-size:13px;color:var(--gray)}.sect-h a:hover{color:var(--ink)}
/* 유형 타일 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);padding:14px 10px 12px;text-align:center;cursor:pointer;background:#fff}
.tile:hover{border-color:var(--acc)}
.tile svg{width:76px;height:52px;display:block;margin:0 auto 8px}
.tile .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.tile .ct{font-size:12px;color:var(--gray);margin-top:2px}
/* 화면 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px 14px}
.sc{cursor:pointer}
.sc img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block;border:1px solid var(--line)}
.sc:hover img{border-color:#8a8a86}
.sc .nm{font-size:13.5px;font-weight:600;margin-top:7px;line-height:1.35}
.sc .sb{font-size:12.5px;color:var(--gray);margin-top:2px;line-height:1.4}
.seg{display:inline-flex;border:1px solid var(--line);margin:0 8px 16px 0}
.seg button{border:0;background:#fff;padding:6px 14px;font-size:13px;color:var(--gray);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:#fff}
.thead{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.thead svg{width:96px;height:66px;flex:none;border:1px solid var(--line);padding:6px;background:#fff}
.rel{background:var(--tint);padding:10px 14px;font-size:13px;margin-bottom:18px;line-height:1.7}
.rel a{text-decoration:underline;margin-right:10px}
/* 데이터 추천 */
.dwrap{display:grid;grid-template-columns:300px 1fr;gap:32px;align-items:start}
.dlist{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;border-right:1px solid var(--line);padding-right:14px}
.dlist .gh{font-size:12.5px;font-weight:700;color:var(--gray);margin:14px 0 4px}
.dlist .it{display:block;padding:7px 8px;font-size:13.5px;line-height:1.4;cursor:pointer;color:#333}
.dlist .it:hover{background:var(--tint)}.dlist .it.on{background:var(--acc2);color:var(--ink);font-weight:600}
.dlist .it i{font-style:normal;color:var(--gray);font-size:11.5px;font-weight:400;display:block}
.facts{display:flex;gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin:16px 0 28px}
.facts div{flex:1;padding:10px 14px 11px 0;font-size:12.5px;color:var(--gray)}
.facts div b{display:block;color:var(--ink);font-size:15px;margin-top:2px}
.step{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.step .n{font-size:13px;font-weight:700;color:var(--acc)}.step h3{margin:0;font-size:17px}
.rtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rtile{border:1px solid var(--line);padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer}
.rtile:hover{border-color:var(--acc)}
.rtile svg{width:70px;height:48px;flex:none}
.rtile .nm{font-weight:700;font-size:14.5px}.rtile .ds{font-size:12px;color:var(--gray);margin-top:2px;line-height:1.4}
.rtile.k1{border-color:var(--acc);background:var(--acc2)}
.also{font-size:13px;color:var(--gray);margin-top:10px}.also a{text-decoration:underline;color:#444;margin-right:8px}
.flow{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.frow .lb{width:100%;font-size:12.5px;color:var(--gray);margin-bottom:4px}
.fb{border:1px solid var(--line);background:#fff;padding:10px 12px;font-size:13px;line-height:1.45;flex:1;min-width:120px;display:flex;gap:8px;align-items:flex-start}
.fb .k{font-weight:700;color:var(--acc);font-size:12px;flex:none;margin-top:1px}
.arr{display:flex;align-items:center;padding:0 6px;color:#aaa;font-size:14px}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.more{margin-top:14px;border:1px solid var(--line);background:#fff;padding:7px 14px;font-size:13px;color:#444}
details{margin-top:30px;border-top:1px solid var(--line)}
details summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:600;color:#444;list-style:none}
details summary::before{content:"+ ";color:var(--gray)}details[open] summary::before{content:"− "}
.kv{border-collapse:collapse;width:100%;font-size:13px}
.kv td{border-bottom:1px solid var(--line2);padding:7px 8px;vertical-align:top;line-height:1.55}
.kv td:first-child{width:120px;color:var(--gray);white-space:nowrap}
ul.plain{margin:6px 0 0;padding-left:18px;line-height:1.7;font-size:13.5px}
.st{font-size:11.5px;padding:1px 6px;border:1px solid;margin-left:6px;font-weight:500;white-space:nowrap}
.st-a{color:#2f5f5a;border-color:#2f5f5a}.st-b{color:#7a5c1e;border-color:#b39a62}.st-c{color:#8a3b2a;border-color:#c08a7e}.st-d{color:#666;border-color:#aaa}
/* 사례 상세 */
.cwrap{display:grid;grid-template-columns:1.25fr 1fr;gap:30px;align-items:start}
.cmain img{width:100%;border:1px solid var(--line);display:block;cursor:zoom-in}
.cthumbs{display:flex;gap:8px;margin-top:8px}
.cthumbs img{width:110px;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);cursor:pointer;opacity:.6}
.cthumbs img.on{opacity:1;border-color:var(--ink)}
.cap{font-size:12.5px;color:var(--gray);margin-top:6px}
.point{background:var(--acc2);padding:14px 16px;font-size:14px;line-height:1.65;margin-bottom:22px}
.point b{display:block;font-size:12.5px;color:var(--acc);margin-bottom:4px}
.chips span{display:inline-block;font-size:12px;border:1px solid var(--line);padding:1px 7px;margin:0 4px 4px 0;color:#444;cursor:pointer}
.chips span:hover{border-color:var(--acc);color:var(--acc)}
/* 확대 보기 */
#modal{position:fixed;inset:0;background:rgba(20,20,20,.86);display:none;z-index:20;align-items:center;justify-content:center}
#modal .box{background:#fff;max-width:96vw;max-height:94vh;display:flex}
#modal img{max-width:74vw;max-height:94vh;display:block;object-fit:contain;background:#1a1a1a}
#modal .info{width:320px;padding:20px;overflow:auto;font-size:13.5px;line-height:1.6}
#modal .info h3{font-size:17px;margin:0 0 4px}
#modal .info a.u{color:var(--gray);font-size:12px;word-break:break-all;text-decoration:underline}
#modal .nav{display:flex;gap:6px;margin-top:16px}
#modal .nav button{border:1px solid var(--line);background:#fff;padding:5px 11px;font-size:12.5px}
#modal .x{position:absolute;top:14px;right:20px;color:#fff;font-size:28px;cursor:pointer;line-height:1}
.empty{padding:50px;text-align:center;color:var(--gray)}
.tm{display:block;font-size:11px;color:var(--gray);font-weight:400;margin-top:1px;letter-spacing:0}
.say{font-size:16px;line-height:1.7;background:var(--acc2);padding:14px 18px;margin:18px 0 6px}
.mk{border:1px solid #c9ccc9;background:#fafaf9;margin-top:4px}
.mk-top{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;font-size:13px}
.mk-top b{font-size:13.5px}.mk-top span{color:var(--gray)}.mk-top em{margin-left:auto;font-style:normal;font-size:11px;border:1px solid var(--gray);color:var(--gray);padding:0 5px}
.mk-f{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line2)}
.mk-f span{border:1px solid var(--line);padding:3px 9px;font-size:12px;color:#444;background:#fff}.mk-f i{font-style:normal;color:#aaa;font-size:10px}
.mk-g{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:12px}
.mp{background:#fff;border:1px solid var(--line2);padding:10px 12px 12px;min-width:0}
.mph{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;gap:7px;align-items:center}
.mph .k{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;background:var(--acc);color:#fff;font-size:11px;border-radius:50%;flex:none}
.msvg{width:100%;height:auto;display:block}
.mlg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:#555;margin-top:4px}.mlg i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
.mnt{font-size:11px;color:var(--gray);margin-top:5px;line-height:1.45}
.mkpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.mkpi>div{padding:4px 14px;border-left:1px solid var(--line2)}.mkpi>div:first-child{border-left:0;padding-left:2px}
.mkpi .l{font-size:12px;color:var(--gray)}.mkpi .v{font-size:24px;font-weight:700;letter-spacing:-.5px;margin:2px 0;font-variant-numeric:tabular-nums}.mkpi .v small{font-size:12.5px;font-weight:500;margin-left:2px;color:#555}
.mkpi .s{font-size:11.5px;color:var(--gray)}
.mhb .r{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}.mhb .n{width:108px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhb .b{flex:1;background:#f1f3f2;height:13px}.mhb .b i{display:block;height:13px;background:var(--acc)}.mhb .v{width:78px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:#444}
.mht{border-collapse:collapse;width:100%;font-size:12px}.mht th{font-weight:500;color:#555;padding:4px 6px;text-align:center}.mht td{text-align:center;padding:7px 4px;border:2px solid #fff;font-variant-numeric:tabular-nums}
.mdn{display:flex;gap:14px;align-items:center}.mdn svg{width:120px;flex:none}.mdn>div{font-size:12px;line-height:1.9}.mdn i{display:inline-block;width:10px;height:10px;margin-right:5px}.mdn span{color:var(--gray)}
.mtile{display:flex;gap:14px;align-items:flex-end}.mtile svg{width:62%;flex:none}.mtl{flex:1;font-size:11.5px}
.mtl .gr{height:10px;background:linear-gradient(90deg,#eef2f1,#a3bdb8,#244a45)}.mtl .lb{display:flex;justify-content:space-between;color:#555;margin-top:3px}
.mtb{max-height:290px;overflow:auto}.mtb table{border-collapse:collapse;width:100%;font-size:12px}.mtb th{text-align:left;font-weight:600;color:#555;border-bottom:1px solid #999;padding:5px 6px;background:#fff;position:sticky;top:0}
.mtb td{border-bottom:1px solid var(--line2);padding:5px 6px;font-variant-numeric:tabular-nums}
.mls>div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12.5px}.mls .tg{flex:none;font-size:11px;border:1px solid #b4614f;color:#b4614f;padding:0 5px;height:18px}
.mls .s{font-size:11.5px;color:var(--gray);margin-top:2px}
.msch .bx{display:flex;border:1.5px solid var(--ink);height:40px;align-items:center;max-width:620px}.msch .bx span{flex:1;padding:0 12px;color:#999;font-size:13px}.msch .bx b{background:var(--ink);color:#fff;height:100%;display:flex;align-items:center;padding:0 18px;font-size:13px}
.msch .rs{margin-top:8px;max-width:620px}.msch .rs div{font-size:12.5px;padding:6px 2px;border-bottom:1px solid var(--line2)}
.mk-note{font-size:12.5px;color:#555;background:var(--tint);padding:9px 12px;margin-top:8px;line-height:1.6}
.nomock{background:var(--tint);padding:12px 14px;font-size:13px;color:#555}
.dlist .it .mk1{font-style:normal;font-size:10.5px;color:var(--acc);border:1px solid var(--acc);padding:0 3px;margin-left:5px;font-weight:500;vertical-align:1px}
.fin-hero{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:center;margin-bottom:30px}
.fin-hero img{width:100%;border:1px solid var(--line);display:block}
.fin-hero .go{display:inline-block;background:var(--ink);color:#fff;padding:11px 20px;font-size:14px;margin-top:14px}
.fin-hero .go:hover{background:#000}
.fin-hero ul{margin:10px 0 0;padding-left:18px;line-height:1.75;font-size:13.5px;color:#444}
.fin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 16px}
.fin-card{display:block;cursor:pointer}
.fin-card img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);display:block}
.fin-card:hover img{border-color:#8a8a86}
.fin-card .nm{font-size:14px;font-weight:700;margin-top:8px}.fin-card .ds{font-size:12.5px;color:var(--gray);margin-top:3px;line-height:1.5}
.fin-card .ref{font-size:11.5px;color:var(--acc);margin-top:4px}
.fin-map{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
.fin-map th{text-align:left;font-weight:600;border-bottom:1px solid #999;padding:7px 8px;color:#444}.fin-map td{border-bottom:1px solid var(--line2);padding:8px;vertical-align:top;line-height:1.55}
.fin-map td:first-child{font-weight:600;white-space:nowrap}

/* ── 정리(2026-11-04) ── */
.hd{gap:22px}
nav .nav-g{display:flex;align-items:center;font-size:11.5px;color:#9a9a96;padding:0 4px 0 14px;margin-left:6px;border-left:1px solid var(--line);height:22px;align-self:center;white-space:nowrap}
nav a{white-space:nowrap}
.sch input{width:150px}
.eyebrow{font-size:12.5px;color:var(--acc);font-weight:600;margin-bottom:6px}
.lead{max-width:860px}
.hm-results{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:6px 0 10px}
.hm-card{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.hm-card.main{border-color:var(--ink)}
.hm-card .pic{display:block;background:var(--tint);border-bottom:1px solid var(--line)}
.hm-card .pic img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;display:block}
.hm-card .tx{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.hm-card .no{font-size:12px;color:var(--gray)}
.hm-card h2{margin:0;font-size:20px;letter-spacing:-.5px}
.hm-card p{margin:0;font-size:13.5px;color:#555;line-height:1.6}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{display:inline-block;border:1px solid var(--ink);padding:8px 14px;font-size:13.5px;background:#fff;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff}
.btn:hover{background:#000;color:#fff}
.btn.txt{border-color:transparent;padding-left:4px;padding-right:4px;color:var(--acc);font-weight:600}
.btn.txt:hover{background:none;color:var(--ink)}
.hm-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
.hm-step{padding:18px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hm-step:first-child{border-left:0}
.hm-step .n{font-size:12px;color:var(--gray)}
.hm-step .num{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.hm-step .num small{font-size:13px;font-weight:500;color:var(--gray);margin-left:3px;letter-spacing:-.2px}
.hm-step p{margin:0;font-size:13px;color:#555;line-height:1.55}
.hm-step a{margin-top:auto;font-size:13px;color:var(--acc);font-weight:600;padding-top:6px}
.rc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;padding:22px 0;border-top:1px solid var(--line2);align-items:start}
.sect-h+.rc{border-top:0;padding-top:4px}
.rc img{width:100%;border:1px solid var(--line);display:block}
.rc .who{font-size:12px;color:var(--gray)}
.rc h2{margin:4px 0 10px;font-size:19px;letter-spacing:-.4px}
.rc ul{margin:0 0 14px;padding-left:18px;line-height:1.75;font-size:13.5px;color:#333}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{border:1px solid var(--line);padding:7px 12px;font-size:13px;background:#fff}
.chips a:hover{border-color:var(--ink)}
details.more{border-top:1px solid var(--line);margin-top:30px}
details.more+details.more{margin-top:0}
details.more summary{cursor:pointer;padding:14px 2px;font-size:15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}

const app=document.getElementById("app");
const thumb=f=>`thumb/${f}`;
function caseCard(i){return `<a class="sc" href="#/case/${i.deep}"><img loading="lazy" src="${thumb(i.f)}" alt=""><div class="nm">${esc(i.site)}</div><div class="sb">${esc(i.country)} · ${esc(i.note)}</div></a>`}
function scCard(i,k,listKey){return `<div class="sc" onclick="openList('${listKey}',${k})"><img loading="lazy" src="${thumb(i.f)}" alt=""><div class="nm">${esc(i.site)}</div><div class="sb">${esc(i.country)} · ${esc(i.note||i.link||"")}</div></div>`}
const LISTS={};
function setList(key,arr){LISTS[key]=arr;return key}
let cur={k:0,key:""};
let modalOpen=false;
function hideM(){document.getElementById("modal").style.display="none";modalOpen=false}
function closeM(){if(!modalOpen)return;hideM();history.back()}
function goM(h){hideM();navMode="click";location.replace(h)}
function openList(key,k){cur={k,key};const i=LISTS[key][k];
  document.getElementById("mimg").src="img/"+i.f;
  document.getElementById("minfo").innerHTML=`<h3>${esc(i.site)}</h3><div class="muted sm">${esc(i.region)} · ${esc(i.country)}</div>
  ${i.note?`<p style="margin:12px 0">${esc(i.note)}</p>`:""}
  ${i.tags&&i.tags.length?`<div><div class="sm muted" style="margin-top:10px">이 화면의 표현 유형</div><div class="chips" style="margin-top:4px">${i.tags.map(t=>`<span title="${esc(NAME[t])}" onclick="goM('#/type/${t}')">${EZ(t)}</span>`).join("")}</div></div>`:""}
  ${i.deep?`<p style="margin:14px 0 0"><a style="text-decoration:underline;color:var(--acc);cursor:pointer" onclick="goM('#/case/${i.deep}')">이 사이트 분석 내용 보기 →</a></p>`:""}
  ${i.url?`<p style="margin:14px 0 0"><a class="u" href="${esc(i.url)}" target="_blank">${esc(i.url)}</a></p>`:""}
  <div class="nav"><button onclick="step(-1)">◀ 이전</button><button onclick="step(1)">다음 ▶</button><button onclick="closeM()">닫기</button></div>
  <div class="sm muted" style="margin-top:8px">${k+1} / ${LISTS[key].length} · 키보드 ← → Esc</div>`;
  document.getElementById("modal").style.display="flex";
  if(!modalOpen){modalOpen=true;history.pushState({m:1},"",location.href)}}
function step(d){const n=LISTS[cur.key].length;openList(cur.key,(cur.k+d+n)%n)}
document.getElementById("modal").onclick=e=>{if(e.target.id=="modal")closeM()};
document.onkeydown=e=>{if(!modalOpen)return;if(e.key=="Escape")closeM();if(e.key=="ArrowRight")step(1);if(e.key=="ArrowLeft")step(-1)};
function tile(c){return `<a class="tile" href="#/type/${c}" title="${esc(DESC[c])}">${ico(c)}<div class="nm">${tn(c)}</div><div class="ct">${cnt(c)}장</div></a>`}
function pick(codes,n){const out=[],seen=new Set();for(const c of codes)for(const i of D.items){if(out.length>=n)break;if(i.tags.includes(c)&&!seen.has(i.site)){seen.add(i.site);out.push(i);break}}return out}

  const sites=new Set(D.items.map(i=>i.site)).size, types=D.tax.reduce((a,g)=>a+g.items.length,0);
  const dom=D.items.filter(i=>i.region=="국내").length, cnt={};D.items.forEach(i=>i.tags.forEach(t=>cnt[t]=(cnt[t]||0)+1));
  const nm={};D.tax.forEach(g=>g.items.forEach(it=>nm[it.code]=it.name));
  const top=["C3","M1","G1","K1"].map(c=>`${nm[c]} ${cnt[c]||0}장`).join(" · ");
  const fld=f=>D.dsets.filter(d=>d.field.length==1&&d.field[0]==f).length, both=D.dsets.filter(d=>d.field.length>1).length;
  app.innerHTML=`<div class="eyebrow">국내외 기후위기 정보 서비스 화면 조사 자료</div>
  <h1>기후위기 정보 서비스 화면 갤러리</h1>
  <p class="lead">국내외 기후위기 관련 사이트 ${sites}곳의 화면 ${D.items.length}장을 수집하고, 표현 유형 분류·사례 분석·데이터별 표현 추천으로 정리함.</p>
  <div class="flow plain">
   <div class="fl"><span class="stp">표현 유형</span><span class="num">${D.items.length}<small>화면 · ${sites}개 사이트</small></span>

  <div class="dwrap"><div class="dlist">${listHtml}</div>
  <div>
    <h2>${esc(d.name)}</h2><div class="muted sm">${esc(d.org)} · ${d.field.join("·")} · ${d.risks.join(", ")}<span class="st ${PUB[d.public[0]]}">현재 ${d.public[0]}</span></div>
    <div class="say"><b>${evs(d.space)}</b> · <b>${evs(d.time)}</b> 데이터임.<br><b>${EZ(top[0])}</b> 형태가 가장 적합함.</div>
    <div class="facts"><div>어디 단위로?<b>${d.space.map(ev).join(", ")}</b></div><div>시간은?<b>${d.time.map(ev).join(", ")}</b></div><div>값의 형태는?<b>${d.value.map(ev).join(", ")}</b></div><div>영향체인 구분<b>${d.kadt.map(ev).join(", ")}</b></div></div>
    <div class="step"><span class="n">추천 1</span><h3>추천 표현</h3></div>
    <div class="rtiles">${top.map((c,k)=>`<a class="rtile ${k==0?"k1":""}" href="#/type/${c}">${ico(c)}<div><div class="nm">${tn(c)}</div><div class="ds">${DESC[c]}</div></div></a>`).join("")}</div>
    ${rest.length?`<div class="also">함께 쓰면 좋은 표현: ${rest.map(c=>`<a href="#/type/${c}" title="${esc(NAME[c])}">${EZ(c)}</a>`).join("")}</div>`:""}

}

/* ── 화면 예시 ── */
const TOPICS=[["전체",[]],["기온·강수",["기온","강수","극한기후","바람"]],["폭염·건강",["폭염","보건","취약계층","한파","도시열섬"]],["가뭄·물·홍수",["가뭄","물","홍수","해수면","해양","해빙"]],["재난·안전",["재난·안전","산불","산사태"]],["농업·생태",["농업","작황","병해충","생태계","산림","토지이용"]],["배출·재정",["배출·에너지","온실가스","재정·예산"]]];
let topicF="전체";
function pCases(){
  const tp=TOPICS.find(t=>t[0]==topicF)[1];
  const list=D.cases.filter(c=>!tp.length||c.topic.some(x=>tp.includes(x)));
  app.innerHTML=`<div class="eyebrow">화면 갤러리</div><h1>사례 분석</h1><p class="lead">데이터 화면 ${D.cases.length}곳을 직접 조작해 잘된 점·아쉬운 점·적용할 점을 정리함. 사례를 누르면 화면별 상세 분석을 볼 수 있음.</p>
  <div class="seg">${TOPICS.map(t=>{const n=t[1].length?D.cases.filter(c=>c.topic.some(x=>t[1].includes(x))).length:D.cases.length;return `<button class="${topicF==t[0]?"on":""}" onclick="setQ('t','${t[0]}')">${t[0]} ${n}</button>`}).join("")}</div>
  <div class="grid">${list.map(c=>`<a class="sc" href="#/case/${c.sid}"><img loading="lazy" src="${thumb(c.shots[0].f)}"><div class="nm">${esc(c.site)}</div><div class="sb">${esc(c.country)}<span> · ${c.display.slice(0,3).map(x=>EZ(x)).join(" · ")}</span></div></a>`).join("")}</div>`;
}

  const shots=c.shots.map(s=>({f:s.f,site:c.site,region:c.region,country:c.country,note:s.action,tags:c.display,url:s.url||c.url}));

  <h2>${esc(c.site)}</h2><div class="muted sm" style="margin-bottom:18px">${esc(c.region)} · ${esc(c.country)} · <a style="text-decoration:underline" href="${esc(c.url)}" target="_blank">${esc(c.url)}</a></div>
  <div class="cwrap"><div class="cmain"><img id="cimg" src="img/${c.shots[0].f}" onclick="openList('${key}',window._ck||0)"><div class="cap" id="ccap">${esc(c.shots[0].action)} · 누르면 크게 보기</div>
    ${c.shots.length>1?`<div class="cthumbs">${c.shots.map((s,k)=>`<img src="${thumb(s.f)}" class="${k?"":"on"}" onclick="window._ck=${k};document.getElementById('cimg').src='img/${s.f}';document.getElementById('ccap').textContent='${esc(s.action)} · 누르면 크게 보기';[...this.parentNode.children].forEach(e=>e.classList.remove('on'));this.classList.add('on')">`).join("")}</div>`:""}</div>
  <div>
    <div class="point"><b>적용 포인트</b>${esc(c.apply)}</div>

    ${ds.length?`<h3 style="margin-top:20px">이 예시를 참고하는 우리 데이터</h3><div class="chips">${ds.map(d=>`<span onclick="go('#/data/${d.id}')">${esc(sn(d))}</span>`).join("")}</div>`:""}

/* ── 검색 ── */
function pSearch(q){
  const s=q.toLowerCase();
  const list=D.items.filter(i=>(i.site+" "+i.country+" "+i.note+" "+i.title+" "+i.tags.map(t=>NAME[t]+" "+EZ(t)).join(" ")).toLowerCase().includes(s));

/* ── 이동 ── */
function route(){
  const [path,qs]=location.hash.replace(/^#\/?/,"").split("?");
  const Q=new URLSearchParams(qs||"");
  regF=Q.get("r")||"전체";fieldF=Q.get("f")||"전체";topicF=Q.get("t")||"전체";
  const h=decodeURIComponent(path).split("/");
  const p=h[0]||"";let n="home";
  if(p=="types"){pTypes();n="types"}else if(p=="type"){pType(h[1]);n="types"}
  else if(p=="data"){pData(h[1]);n="data"}else if(p=="cases"){pCases();n="cases"}else if(p=="case"){pCase(h[1]);n="cases"}
  else if(p=="search"){pSearch(h.slice(1).join("/"));n=""}else if(p=="final"||p=="next"){location.replace("result.html#/"+p);return}else pHome();
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.n==n));
}
/* 이동 방식: click=새 페이지(맨 위), keep=필터 변경(위치 유지), 그 외=뒤로·앞으로(기억한 위치 복원) */
history.scrollRestoration="manual";
const SCR={};let navMode="";
const hkey=h=>(h&&h!="#")?decodeURIComponent(h):"#/";
function go(h){navMode="click";location.hash=h}
function setQ(k,v){const [p,qs]=location.hash.split("?");const Q=new URLSearchParams(qs||"");if(v=="전체")Q.delete(k);else Q.set(k,v);const q=Q.toString();navMode="keep";location.replace((p||"#/")+(q?"?"+q:""))}
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='#']");if(a)navMode="click"},true);
window.addEventListener("popstate",e=>{if(modalOpen&&!(e.state&&e.state.m))hideM()});
window.addEventListener("hashchange",e=>{
  SCR[hkey("#"+(e.oldURL.split("#")[1]||""))]=window.scrollY;
  if(modalOpen)hideM();
  const m=navMode;navMode="";const y=window.scrollY;
  route();
  if(m=="keep")window.scrollTo(0,y);else if(m=="click")window.scrollTo(0,0);else window.scrollTo(0,SCR[hkey(location.hash)]||0);
});
route();
</script><script>
/* 올바른 폴더로 열렸는지 확인: 상위 폴더를 통째로 올렸거나 파일을 직접 열면 대국민·공무원 화면이 열리지 않음 */

  const bar=t=>{const d=document.createElement('div');d.style.cssText='position:sticky;top:0;z-index:9999;background:#b91c1c;color:#fff;padding:12px 20px;font-size:14px;line-height:1.6';d.innerHTML=t;document.body.prepend(d)};
  if(location.protocol==='file:'){bar('파일을 직접 연 상태라 대국민·공무원 화면은 열리지 않음. <b>고도화화면_실행.bat</b>을 실행하거나, Netlify에 <b>deploy 폴더</b>를 올려야 함.');return}

  }catch(e){}
})();
</script>
